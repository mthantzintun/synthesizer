services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: litreview-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-litreview}
      POSTGRES_USER: ${POSTGRES_USER:-litreview}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-litreview_dev}
    ports:
      - "5432:5432"
    volumes:
    - pg_data:/var/lib/postgresql/data
    # schema will be created by Flyway (db/migration/V1__init_schema.sql), which runs on application start
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-litreview}"]
      interval: 5s
      timeout: 5s
      retries: 10

  grobid:
    image: lfoppiano/grobid:0.8.1
    container_name: litreview-grobid
    ports:
    - "8070:8070"
    environment:
    - JAVA_OPTS=-Xmx16g
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8070/api/isalive"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 60s
  pgadmin:
    image: dpage/pgadmin4
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:-admin@local.dev}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:-admin}
    ports: ["5050:80"]

volumes:
  pg_data:
